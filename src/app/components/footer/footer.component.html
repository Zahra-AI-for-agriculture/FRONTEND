<footer class="footer" id="footer">
  <div class="container">
    <div class="footer-content">
      <!-- Brand -->
      <div class="footer-brand">
        <a class="footer-logo" (click)="scrollTo('hero')">
          <svg class="footer-leaf" width="28" height="28" viewBox="0 0 24 24" fill="none">
            <path d="M12 2C6.5 2 2 6.5 2 12c0 3.5 1.8 6.6 4.5 8.4C7 17 8.5 14 12 14s5 3 5.5 6.4C20.2 18.6 22 15.5 22 12c0-5.5-4.5-10-10-10z" fill="url(#footerLeafGrad)"/>
            <defs>
              <linearGradient id="footerLeafGrad" x1="0" y1="0" x2="24" y2="24">
                <stop offset="0%" stop-color="#4caf50"/>
                <stop offset="100%" stop-color="#66bb6a"/>
              </linearGradient>
            </defs>
          </svg>
          <span class="logo-text">ZAHRA</span>
          <span class="logo-arabic">زهرة</span>
        </a>
        <p class="footer-tagline">{{ lang.t('footer.tagline') }}</p>
      </div>

      <!-- Navigation -->
      <div class="footer-nav">
        <a (click)="scrollTo('pipeline')">{{ lang.t('nav.solution') }}</a>
        <a (click)="scrollTo('features')">{{ lang.t('nav.features') }}</a>
        <a (click)="scrollTo('stats')">{{ lang.t('nav.stats') }}</a>
        <a (click)="scrollTo('cta-section')">{{ lang.t('nav.contact') }}</a>
      </div>
    </div>

    <!-- Bottom Bar -->
    <div class="footer-bottom">
      <p class="footer-copyright">{{ lang.t('footer.rights') }}</p>
    </div>
  </div>
</footer>
