<section class="problem section" id="problem">
  <div class="container">
    <div class="problem-layout" [class.visible]="isVisible">
      <!-- Left: Image -->
      <div class="problem-image-wrapper">
        <div class="image-frame">
          <img src="assets/images/farmer-portrait.png" alt="Mohamed" class="farmer-image" loading="lazy">
          <div class="image-overlay"></div>
        </div>
        <!-- Name badge -->
        <div class="name-badge glass-card">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
          <div class="name-info">
            <span class="name-text">{{ lang.t('problem.title') }}</span>
            <span class="name-location">{{ lang.t('problem.who') }}</span>
          </div>
        </div>
      </div>

      <!-- Right: Pain Points — VERY SHORT -->
      <div class="problem-content">
        <!-- Pain Points -->
        <div class="pain-points">
          <div class="pain-point glass-card" *ngFor="let pain of painPoints; let i = index"
               [style.--pain-delay]="(i * 0.15) + 's'"
               [style.--pain-color]="pain.color"
               [class.visible]="isVisible">
            <div class="pain-icon-circle">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path [attr.d]="pain.svgPath"/>
              </svg>
            </div>
            <span class="pain-text">{{ lang.t(pain.textKey) }}</span>
          </div>
        </div>

        <!-- Solution callout — short -->
        <div class="solution-callout" [class.visible]="isVisible">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
            <polyline points="22 4 12 14.01 9 11.01"/>
          </svg>
          <p class="callout-text">{{ lang.t('problem.solution') }}</p>
        </div>
      </div>
    </div>
  </div>
</section>
