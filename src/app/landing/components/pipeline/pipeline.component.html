<section class="pipeline" id="pipeline">
  <div class="pipeline-inner">

    <!-- Header -->
    <div class="pipeline-header" [class.visible]="isVisible">
      <span class="pipeline-badge">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
        </svg>
        {{ lang.lang === 'fr' ? 'Comment ça marche' : 'كيفاش تخدم' }}
      </span>
      <h2 class="pipeline-title">{{ lang.t('pipeline.title') }}</h2>
    </div>

    <!-- Cards -->
    <div class="steps-track" [class.visible]="isVisible">

      <div class="card-container"
           *ngFor="let step of steps; let i = index"
           [class.visible]="isVisible"
           [style.--delay]="(i * 0.15) + 's'"
           [style.--accent]="step.accentColor"
           [style.--glow]="step.accentGlow"
           [style.--gradient]="step.gradient">

        <!-- Blurred glow shadow behind card -->
        <div class="card-shadow" aria-hidden="true"></div>

        <div class="card">
          <!-- Image layer (visible by default, zooms + blurs on hover) -->
          <div class="img-content">
            <img [src]="step.image"
                 [alt]="lang.t(step.titleKey)"
                 class="step-img"
                 loading="lazy">
            <!-- Step number watermark -->
            <span class="step-num-watermark" aria-hidden="true">{{ i + 1 }}</span>
          </div>

          <!-- Content layer (hidden by default, slides up on hover) -->
          <div class="card-content">
            <div class="card-content-badge">{{ i + 1 }}</div>
            <p class="card-content-heading">{{ lang.t(step.titleKey) }}</p>
            <p class="card-content-desc">{{ lang.t(step.descKey) }}</p>
          </div>
        </div>

      </div>

    </div>

  </div>
</section>
