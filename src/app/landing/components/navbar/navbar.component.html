<nav class="navbar" [class.scrolled]="isScrolled" [class.menu-open]="isMobileMenuOpen" id="navbar">
  <div class="nav-container">

    <!-- Logo -->
    <a class="nav-logo" (click)="scrollTo('hero')">
      <div class="logo-mark">
        <svg class="logo-svg" width="36" height="36" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="logoLeaf" x1="8" y1="4" x2="32" y2="36">
              <stop offset="0%" stop-color="#81c784"/>
              <stop offset="100%" stop-color="#2e7d32"/>
            </linearGradient>
            <linearGradient id="logoAccent" x1="20" y1="0" x2="20" y2="40">
              <stop offset="0%" stop-color="#66bb6a" stop-opacity="0.9"/>
              <stop offset="100%" stop-color="#388e3c" stop-opacity="0.6"/>
            </linearGradient>
            <filter id="logoGlow">
              <feGaussianBlur stdDeviation="1.5" result="blur"/>
              <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
              </feMerge>
            </filter>
          </defs>
          <circle cx="20" cy="20" r="18" fill="rgba(76, 175, 80, 0.08)" stroke="rgba(76, 175, 80, 0.15)" stroke-width="1"/>
          <path d="M20 32 C20 24, 28 18, 32 8 C24 12, 20 18, 20 32Z" fill="url(#logoLeaf)" filter="url(#logoGlow)"/>
          <path d="M20 32 C20 26, 12 20, 8 12 C14 16, 20 22, 20 32Z" fill="url(#logoAccent)" opacity="0.85"/>
          <path d="M20 32 C20 28, 22 22, 26 18 C22 20, 20 24, 20 32Z" fill="#a5d6a7" opacity="0.5"/>
          <line x1="20" y1="32" x2="20" y2="37" stroke="url(#logoLeaf)" stroke-width="2" stroke-linecap="round"/>
          <circle cx="26" cy="14" r="1.2" fill="#81c784" opacity="0.7"/>
          <circle cx="14" cy="18" r="1" fill="#66bb6a" opacity="0.5"/>
          <circle cx="24" cy="22" r="0.8" fill="#a5d6a7" opacity="0.4"/>
        </svg>
      </div>
      <div class="logo-wordmark">
        <span class="logo-text">ZAHRA</span>
        <span class="logo-arabic">زهرة</span>
      </div>
    </a>

    <!-- Desktop Navigation -->
    <ul class="nav-links">
      <li>
        <a (click)="scrollTo('pipeline')" [class.active]="activeSection === 'pipeline'">
          {{ lang.t('nav.solution') }}
        </a>
      </li>
      <li>
        <a (click)="scrollTo('features')" [class.active]="activeSection === 'features'">
          {{ lang.t('nav.features') }}
        </a>
      </li>
      <li>
        <a (click)="scrollTo('stats')" [class.active]="activeSection === 'stats'">
          {{ lang.t('nav.stats') }}
        </a>
      </li>
      <li>
        <a (click)="scrollTo('cta-section')" [class.active]="activeSection === 'cta-section'">
          {{ lang.t('nav.contact') }}
        </a>
      </li>
    </ul>

    <!-- Right Actions -->
    <div class="nav-actions">
      <!-- Language Toggle -->
      <div class="lang-toggle" role="group" aria-label="Language switcher">
        <button
          class="lang-btn"
          [class.active]="lang.lang === 'fr'"
          (click)="lang.lang !== 'fr' && lang.toggleLanguage()"
          aria-label="Switch to French">
          <span class="lang-flag">🇫🇷</span>
          <span class="lang-label">FR</span>
        </button>
        <div class="lang-divider"></div>
        <button
          class="lang-btn"
          [class.active]="lang.lang === 'ar'"
          (click)="lang.lang !== 'ar' && lang.toggleLanguage()"
          aria-label="Switch to Arabic">
          <span class="lang-flag">🇹🇳</span>
          <span class="lang-label">AR</span>
        </button>
      </div>

    

      <!-- Hamburger -->
      <button class="hamburger" [class.open]="isMobileMenuOpen"
              (click)="toggleMobileMenu()" aria-label="Toggle menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>

  </div>

  <!-- Mobile Menu -->
  <div class="mobile-menu" [class.open]="isMobileMenuOpen">
    <ul class="mobile-links">
      <li>
        <a (click)="scrollTo('pipeline')" [class.active]="activeSection === 'pipeline'">
          {{ lang.t('nav.solution') }}
        </a>
      </li>
      <li>
        <a (click)="scrollTo('features')" [class.active]="activeSection === 'features'">
          {{ lang.t('nav.features') }}
        </a>
      </li>
      <li>
        <a (click)="scrollTo('stats')" [class.active]="activeSection === 'stats'">
          {{ lang.t('nav.stats') }}
        </a>
      </li>
      <li>
        <a (click)="scrollTo('cta-section')" [class.active]="activeSection === 'cta-section'">
          {{ lang.t('nav.contact') }}
        </a>
      </li>
    </ul>

    <div class="mobile-cta-wrap">
      <button class="mobile-cta" (click)="scrollTo('cta-section')">
        <span>{{ lang.lang === 'fr' ? 'Commencer maintenant' : 'ابدأ الآن' }}</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14M12 5l7 7-7 7"/>
        </svg>
      </button>
    </div>
  </div>

</nav>
