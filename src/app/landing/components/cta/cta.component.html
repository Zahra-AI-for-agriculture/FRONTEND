<section class="cta-section section" id="cta-section">
  <div class="container">
    <div class="cta-wrapper" [class.visible]="isVisible">
      <!-- Background effects -->
      <div class="cta-bg-effects">
        <div class="cta-glow cta-glow-1"></div>
        <div class="cta-glow cta-glow-2"></div>
      </div>

      <!-- Content -->
      <div class="cta-content">
        <!-- Title — ONE word -->
        <h2 class="cta-title">{{ lang.t('cta.title') }}</h2>

        <!-- CTA Buttons — BIG, clear -->
        <div class="cta-buttons">
          <button class="btn btn-gold btn-xl" id="cta-download">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="7 10 12 15 17 10"/>
              <line x1="12" y1="15" x2="12" y2="3"/>
            </svg>
            <span>{{ lang.t('cta.download') }}</span>
          </button>

          <button class="btn btn-primary btn-xl" id="cta-demo">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/>
              <polygon points="10 8 16 12 10 16 10 8"/>
            </svg>
            <span>{{ lang.t('cta.demo') }}</span>
          </button>

          <button class="btn btn-secondary btn-xl" id="cta-contact">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
            </svg>
            <span>{{ lang.t('cta.contact') }}</span>
          </button>
        </div>
      </div>
    </div>
  </div>
</section>
