<footer class="footer" id="footer">
  <div class="footer-container">

    <!-- Top row: logo left, nav right -->
    <div class="footer-top">

      <!-- Brand -->
      <a class="footer-logo" (click)="scrollTo('hero')">
        <div class="footer-logo-mark">
          <svg width="32" height="32" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="fLeaf" x1="8" y1="4" x2="32" y2="36">
                <stop offset="0%" stop-color="#81c784"/>
                <stop offset="100%" stop-color="#2e7d32"/>
              </linearGradient>
            </defs>
            <circle cx="20" cy="20" r="18" fill="rgba(76,175,80,0.08)" stroke="rgba(76,175,80,0.15)" stroke-width="1"/>
            <path d="M20 32 C20 24, 28 18, 32 8 C24 12, 20 18, 20 32Z" fill="url(#fLeaf)"/>
            <path d="M20 32 C20 26, 12 20, 8 12 C14 16, 20 22, 20 32Z" fill="#66bb6a" opacity="0.8"/>
            <line x1="20" y1="32" x2="20" y2="37" stroke="url(#fLeaf)" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="footer-wordmark">
          <span class="footer-logo-text">ZAHRA</span>
          <span class="footer-logo-arabic">زهرة</span>
        </div>
      </a>

      <!-- Nav links -->
      <nav class="footer-nav" aria-label="Footer navigation">
        <a (click)="scrollTo('pipeline')">{{ lang.t('nav.solution') }}</a>
        <a (click)="scrollTo('features')">{{ lang.t('nav.features') }}</a>
        <a (click)="scrollTo('stats')">{{ lang.t('nav.stats') }}</a>
        <a (click)="scrollTo('cta-section')">{{ lang.t('nav.contact') }}</a>
      </nav>

    </div>

    <!-- Divider -->
    <div class="footer-divider" aria-hidden="true"></div>

    <!-- Bottom row: tagline left, copyright right -->
    <div class="footer-bottom">
      <p class="footer-tagline">{{ lang.t('footer.tagline') }}</p>
      <p class="footer-copyright">{{ lang.t('footer.rights') }}</p>
    </div>

  </div>
</footer>
