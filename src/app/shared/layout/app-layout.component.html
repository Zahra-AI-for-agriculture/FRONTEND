<div class="layout-wrapper" [class.sidebar-collapsed]="!sidebarOpen">

  <!-- Sidebar -->
  <aside class="sidebar">

    <!-- Brand -->
    <div class="sidebar-brand">
      <span class="brand-icon">🌿</span>
      <span class="brand-name" *ngIf="sidebarOpen">Zahra</span>
    </div>

    <!-- Navigation -->
    <nav class="sidebar-nav">
      <a class="nav-item"
         *ngFor="let item of navItems"
         [routerLink]="item.path"
         [class.active]="isActive(item.path)">
        <span class="nav-icon">{{ item.icon }}</span>
        <span class="nav-label" *ngIf="sidebarOpen">{{ item.label }}</span>
        <span class="nav-badge"
              *ngIf="item.path === '/alerts' && unreadAlerts > 0">
          {{ unreadAlerts }}
        </span>
      </a>
    </nav>

    <!-- Footer sidebar -->
    <div class="sidebar-footer">
      <div class="farmer-info" *ngIf="sidebarOpen">
        <div class="farmer-avatar">
          {{ farmerName.charAt(0).toUpperCase() }}
        </div>
        <span class="farmer-name">{{ farmerName }}</span>
      </div>
      <button class="btn-logout" (click)="logout()" title="Déconnexion">
        🚪
      </button>
    </div>

  </aside>

  <!-- Main content -->
  <div class="main-content">

    <!-- Topbar -->
    <header class="topbar">
      <button class="btn-toggle" (click)="toggleSidebar()">
        {{ sidebarOpen ? '◀' : '▶' }}
      </button>
      <div class="topbar-right">
        <span class="topbar-farmer">👨‍🌾 {{ farmerName }}</span>
        <a routerLink="/alerts" class="topbar-alerts">
          🔔
          <span class="alert-badge" *ngIf="unreadAlerts > 0">
            {{ unreadAlerts }}
          </span>
        </a>
      </div>
    </header>

    <!-- Page content -->
    <main class="page-content">
      <router-outlet></router-outlet>
    </main>

  </div>
</div>
